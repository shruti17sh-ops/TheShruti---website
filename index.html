<!DOCTYPE html>
<html lang="en">
<head>

    <title>Shruti | Personal Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);

        h1 {
            margin-bottom: 10px;
            font-size: 36px;
        }

        .intro {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
        }

        .instagram {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #E1306C;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .instagram:hover {
            background: #c91f58;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hi, I'm Shruti 👋</h1>

        <p class="intro">
            Hello! I'm Shruti. Welcome to my personal website.

            and connect with me.
        </p>

        <a
            class="instagram"
            href="https://www.instagram.com/_shruti_1706/"
            target="_blank"
            rel="noopener noreferrer">

        <footer>
            © 2026 Shruti. All rights reserved.
        </footer>
